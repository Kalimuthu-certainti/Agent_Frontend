# Builds the static dashboard and publishes it to GitHub Pages.
# One-time: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        env:
          # Project Pages serve under /<repo>/. Change if you rename the repo,
          # or set VITE_BASE '/' for a custom domain at the root.
          VITE_BASE: '/Agent_Frontend/'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
