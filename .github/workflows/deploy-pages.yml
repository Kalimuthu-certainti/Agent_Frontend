# Builds the static-demo frontend and publishes it to GitHub Pages.
# Enable once: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy static demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build static demo
        working-directory: web
        env:
          VITE_STATIC: '1'
          # Project Pages serve under /<repo>/. Change if you rename the repo
          # or attach a custom domain (then set VITE_BASE: '/').
          VITE_BASE: '/Agent_Frontend/'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
