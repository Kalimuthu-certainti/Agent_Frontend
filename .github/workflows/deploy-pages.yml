# Deploys the dashboard to GitHub Pages on every push to main.
#
# Mail is NOT sent from here. The agent sends approval mail itself, in its own
# flow, with `node scripts/notify-gate.mjs <GATE> <subject> <html>` — it talks to
# Microsoft Graph directly and reads the Graph credentials from the local
# environment / Keychain. No Graph secret is needed in this repo's Actions
# Secrets, and no GitHub token is needed by the agent.
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- deploy (push only) --------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: '/Agent_Frontend/'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
